<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Productos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Administración de Productos</h1>
</header>

<section class="contenedor">

    <h2>Registrar Producto</h2>

    <form id="formulario">

        <input
            type="text"
            id="nombre"
            placeholder="Nombre del producto"
            required
        >

        <input
            type="number"
            id="precio"
            placeholder="Precio"
            required
        >

        <input
            type="number"
            id="stock"
            placeholder="Stock"
            required
        >

        <button type="submit">
            Guardar Producto
        </button>

    </form>

    <hr>

    <h2>Lista de Productos</h2>

    <table>

        <thead>

            <tr>

                <th>Nombre</th>

                <th>Precio</th>

                <th>Stock</th>

                <th>Acciones</th>

            </tr>

        </thead>

        <tbody id="tablaProductos">

        </tbody>

    </table>

</section>

<script src="script.js"></script>

</body>
</html>
