<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="/mini-proyecto/src/style/style.css">
</head>
<body>

<div class="login-container">

    <h1>Bienvenido</h1>
    <p>Inicia sesión para continuar</p>

    <form id="loginForm">

        <input
            type="text"
            id="usuario"
            placeholder="Usuario"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            required
        >

        <button type="submit">
            Ingresar
        </button>

        <p id="mensaje"></p>

    </form>

</div>

<script src="js/login.js"></script>

</body>
</html>
