<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Proveedores</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <h1>Dashboard Administrativo</h1>
        <span>Módulo: Gestión de Proveedores</span>
    </header>

    <main class="container">
        <!-- Formulario de Registro / Edición -->
        <section class="card">
            <h2 id="form-title">Registrar Proveedor</h2>
            <form id="supplier-form" novalidate>
                <input type="hidden" id="supplier-id">

                <div class="form-group">
                    <label for="company">Nombre de la Empresa / Proveedor *</label>
                    <input type="text" id="company" required placeholder="Ej. TecnoSuministros S.A.">
                    <small class="error-message" id="error-company"></small>
                </div>

                <div class="form-group">
                    <label for="contact">Persona de Contacto *</label>
                    <input type="text" id="contact" required placeholder="Ej. Ana Martínez">
                    <small class="error-message" id="error-contact"></small>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico *</label>
                    <input type="email" id="email" required placeholder="ejemplo@proveedor.com">
                    <small class="error-message" id="error-email"></small>
                </div>

                <div class="form-group">
                    <label for="phone">Teléfono *</label>
                    <input type="tel" id="phone" required placeholder="Ej. 88888888">
                    <small class="error-message" id="error-phone"></small>
                </div>

                <div class="form-group">
                    <label for="category">Categoría *</label>
                    <select id="category" required>
                        <option value="">Seleccione una categoría</option>
                        <option value="Tecnología">Tecnología</option>
                        <option value="Logística">Logística</option>
                        <option value="Insumos">Insumos</option>
                        <option value="Servicios">Servicios</option>
                    </select>
                    <small class="error-message" id="error-category"></small>
                </div>

                <div class="form-actions">
                    <button type="submit" id="btn-save" class="btn btn-primary">Guardar Proveedor</button>
                    <button type="button" id="btn-cancel" class="btn btn-secondary hidden">Cancelar Edición</button>
                </div>
            </form>
        </section>

        <!-- Tabla de Consulta y Filtros -->
        <section class="card">
            <h2>Listado de Proveedores</h2>

            <div class="filter-group">
                <input type="text" id="search-input" placeholder="Buscar por empresa o contacto...">
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Empresa</th>
                            <th>Contacto</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Categoría</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="suppliers-table-body">
                        <!-- Filas dinámicas generadas desde JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
